<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/criar_pet.css')}}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.2/css/all.css" />
    <title>Cadastrar novo animal</title>
</head>

<body>
    <header>
        <span>
            <a href="{{ url_for('ir_crud_pets') }}" aria-label="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </span>
    </header>
    <main>
        <div class="titulo">
            <h1>Cadastrar novo animal</h1>
        </div>
        <form action="/criar_pet" method="post" enctype="multipart/form-data">
            <div class="infos-container">
                <div class="info-gerais">
                    <h1>Informações Gerais</h1>
                    <input type="text" id="nome" name="nome" required placeholder="Nome">
                    <input type="text" id="especie" name="especie" required placeholder="Espécie">
                    <input type="text" id="raca" name="raca" required placeholder="Raça">
                    <input type="number" id="idade" name="idade" required placeholder="Idade">
                    <input type="file" id="foto" name="foto" accept="image/*">
                </div>
                <hr>
                <div class="info_saude">
                    <h1>Saúde</h1>
                    <input type="text" name="estado_saude" placeholder="Estado de Saúde" id="estado_saude">
                    <input type="date" name="data_chegada" id="data_chegada" placeholder="Data de chegada">
                    <input type="text" name="comportamento" id="comportamento" placeholder="Comportamento">
                </div>
            </div>
            <div class="botao">
                <button type="submit">Adicionar</button>
            </div>
        </form>
    </main>
</body>

</html>
